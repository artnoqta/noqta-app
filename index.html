<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نُقطة | Noqta IELTS Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🎯</span>
                <div>
                    <h1 class="text-2xl font-black tracking-wider">نُقطة | Noqta IELTS</h1>
                    <p class="text-xs text-indigo-200">المنصة المتكاملة لإتقان اختبار الإيلتس</p>
                </div>
            </div>
            <div class="bg-indigo-800 border border-indigo-500 px-4 py-2 rounded-xl text-sm font-bold shadow-inner">
                ⏱️ المؤقت: <span id="timer-display">40:00</span>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white shadow-md border-b border-slate-200">
        <div class="max-w-6xl mx-auto flex overflow-x-auto">
            <button onclick="loadSection('grammar', this)" class="tab-btn flex-1 py-4 px-4 text-center font-bold text-indigo-600 border-b-4 border-indigo-600 transition-all whitespace-nowrap">👑 ماستر القواعد والكلمات</button>
            <button onclick="loadSection('reading', this)" class="tab-btn flex-1 py-4 px-4 text-center font-medium text-slate-500 hover:text-indigo-600 transition-all whitespace-nowrap">📖 القراءة الأكاديمية</button>
            <button onclick="loadSection('listening', this)" class="tab-btn flex-1 py-4 px-4 text-center font-medium text-slate-500 hover:text-indigo-600 transition-all whitespace-nowrap">🎧 الاستماع</button>
            <button onclick="loadSection('speaking', this)" class="tab-btn flex-1 py-4 px-4 text-center font-medium text-slate-500 hover:text-indigo-600 transition-all whitespace-nowrap">🗣️ المتحدث الصوتي</button>
        </div>
    </nav>

    <!-- Dynamic Content Area -->
    <main id="content-area" class="max-w-6xl mx-auto p-4 sm:p-6 flex-1 w-full">
        <!-- سيتم جلب وعرض محتوى القسم هنا تلقائياً -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 text-center py-6 text-slate-500 text-xs mt-auto">
        تم التطوير بحب لتجاوز اختبار الإيلتس بنجاح 🚀 &copy; 2026 Noqta IELTS Platform
    </footer>

    <!-- Component Loader & Script Execution Engine -->
    <script>
        async function loadSection(sectionName, clickedBtn) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-b-4', 'border-indigo-600', 'text-indigo-600', 'font-bold');
                btn.classList.add('text-slate-500', 'font-medium');
            });
            if(clickedBtn) {
                clickedBtn.classList.remove('text-slate-500', 'font-medium');
                clickedBtn.classList.add('border-b-4', 'border-indigo-600', 'text-indigo-600', 'font-bold');
            }

            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `<div class="text-center py-12 text-slate-400 font-medium animate-pulse">جاري تحميل القسم... ⏳</div>`;

            try {
                const response = await fetch(`components/${sectionName}.html`);
                if (!response.ok) throw new Error("تعذر تحميل الملف");
                const htmlText = await response.text();
                contentArea.innerHTML = htmlText;
                executeScriptsInElement(contentArea);
            } catch (error) {
                contentArea.innerHTML = `
                    <div class="bg-rose-50 border border-rose-200 p-6 rounded-2xl text-center text-rose-700">
                        <p class="font-bold mb-1">عذراً، تعذر تحميل القسم components/${sectionName}.html</p>
                        <p class="text-xs text-rose-500">تأكدي من فتح المجلد الرئيسي في VS Code وتشغيل Live Server.</p>
                    </div>
                `;
            }
        }

        function executeScriptsInElement(container) {
            const scripts = container.querySelectorAll("script");
            scripts.forEach(script => {
                const newScript = document.createElement("script");
                newScript.text = script.innerText;
                document.body.appendChild(newScript);
                script.remove();
            });
        }

        let totalSeconds = 2400;
        setInterval(() => {
            if(totalSeconds > 0) {
                totalSeconds--;
                const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
                const s = String(totalSeconds % 60).padStart(2, '0');
                const timerEl = document.getElementById('timer-display');
                if(timerEl) timerEl.textContent = `${m}:${s}`;
            }
        }, 1000);

        window.addEventListener('DOMContentLoaded', () => {
            const firstTab = document.querySelector('.tab-btn');
            loadSection('grammar', firstTab);
        });
    </script>
</body>
</html>
